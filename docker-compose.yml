version: '3.8'

services:
  # ── PostgreSQL Database Service ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: resqnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resqdb}
      POSTGRES_USER: ${POSTGRES_USER:-resquser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resqpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resquser} -d ${POSTGRES_DB:-resqdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend Service ─────────────────────────────────────────────
  backend:
    build:
      context: ./ResQNet
      dockerfile: Dockerfile
    container_name: resqnet-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-resqdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-resquser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-resqpassword}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-UmVzUU5ldFN1cGVyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb24yMDI1}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@resqnet.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin@123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
