services:
  - type: web
    name: resqnet-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://resqnet-backend-zjvh.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html